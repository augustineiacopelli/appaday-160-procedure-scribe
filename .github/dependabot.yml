version: 2
updates:
  # Runtime libraries (docx, ffmpeg, transformers, fonts): never merge directly; follow the upgrade procedure in VERSIONS.md.
  # Test tooling (@playwright/test) and GitHub actions: merge once the smoke test passes on the PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
