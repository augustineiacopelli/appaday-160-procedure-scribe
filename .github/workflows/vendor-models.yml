name: Vendor models and fixtures
# Run by hand. Downloads whisper tiny and base at the commit hashes in models/REVISIONS.json
# (recording them on first run), regenerates vendor/ and MANIFEST.json, builds speech fixtures,
# and commits the result. This is the only job that talks to Hugging Face.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: node scripts/vendor.mjs --models
      - run: bash scripts/make-fixtures.sh
      - run: node scripts/verify-manifest.mjs
      - run: du -sh vendor models tests spikes || true
      - name: Commit in small pushes
        # One push per large file keeps each request well under the server timeout.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          push() { for n in 1 2 3; do git push && return 0; sleep 10; done; return 1; }
          step() {
            git add -A -- "$@" 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "Vendor: $1"
            push
          }
          for f in $(find models -name '*.onnx' -size +20M | sort); do step "$f"; done
          step models
          step vendor/ort
          step vendor/ffmpeg
          step tests
          step vendor
